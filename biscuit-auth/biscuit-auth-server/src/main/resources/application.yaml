spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  servlet:
    multipart:
      max-request-size: 500MB
      max-file-size: 500MB
  #数据源配置
  datasource:
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      connection-timeout: 60000
      connection-test-query: SELECT 1
  cloud:
    openfeign:
      okhttp:
        enabled: true
      httpclient:
        connection-timeout: 10000
        max-connections: 200
        time-to-live: 900
        ok-http:
          read-timeout: 30



# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,caches
    jmx:
      exposure:
        include: health,info,metrics,loggers,caches
  endpoint:
    health:
      show-details: always
# mybatis plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  tenant:
    enabled: true # 启动多租户配置
    ignore-tenant-tables:
      - t_oauth_client_details
  mapper:
    base-packages: cn.bbwres.biscuit.module.auth.dao
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement
  user-info: cn.bbwres.biscuit.web.supplier.UserInfoSupplier









