server:
  port: 28001
management:
  server:
    port: 27001
logging:
  file:
    name: logs/${spring.application.name}.log
  config: classpath:logback-spring-sleuth.xml
#  level:
#    root: debug

spring:
  application:
    name: auth
  config:
    import:
      - nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
#        username: ${NACOS_USERNAME:nacos}
#        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
#        username: ${NACOS_USERNAME:nacos}
#        password: ${NACOS_PASSWORD:nacos}
        group: DEFAULT_GROUP
        file-extension: yaml

  datasource:
    # 数据库配置
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/auth
    username: postgresql
    password: admin
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          enabled: true
          max-active: 10
          min-idle: 5


  # 接口文档配置
springdoc:
  disable-i18n: true
  api-docs:
    enabled: true
    swagger:
      title: 认证服务
      description: 认证服务
      author: zlf
      version: 1.0
  packages-to-scan:
    - cn.bbwres.biscuit.module.auth.controller
  show-oauth2-endpoints: true

biscuit:
  # 配置验证码的背景资源
  captcha:
    login-failure-captcha-threshold: 3
    captcha-resource:
      SLIDER:
        - bgimages/slider
  security:
    token-store-type: redis
  rpc:
    security:
      enable: true



captcha:
  prefix: captcha
  expire:
    default: 10000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 20000
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000


