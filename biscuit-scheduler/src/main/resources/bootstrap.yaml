server:
  port: 28101
management:
  server:
    port: 27101
logging:
  file:
    name: logs/${spring.application.name}.log
  config: classpath:logback-spring-sleuth.xml
#  level:
#    root: debug

spring:
  application:
    name: scheduler
  config:
    import:
      - nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
      #        username: ${NACOS_USERNAME:nacos}
      #        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        #        username: ${NACOS_USERNAME:nacos}
        #        password: ${NACOS_PASSWORD:nacos}
        group: DEFAULT_GROUP
        file-extension: yaml
  quartz:
    jdbc:
      table-prefix: t_qrtz_
      job-store-type: jdbc

  datasource:
    # 数据库配置
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/scheduler
    username: postgresql
    password: admin






  # 接口文档配置
springdoc:
  disable-i18n: true
  api-docs:
    enabled: true
    swagger:
      title: 定时任务服务
      description: 定时任务服务
      author: zlf
      version: 1.0
  packages-to-scan:
    - cn.bbwres.biscuit.module.auth.controller
  show-oauth2-endpoints: true

biscuit:
  rpc:
    security:
      enable: true





