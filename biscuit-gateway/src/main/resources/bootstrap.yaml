spring:
  application:
    name: gateway
  config:
    import:
      - nacos:${spring.application.name}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
#        username: ${NACOS_USERNAME:nacos}
#        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
#        username: ${NACOS_USERNAME:nacos}
#        password: ${NACOS_PASSWORD:nacos}
        group: DEFAULT_GROUP
        file-extension: yaml
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1


server:
  port: 28000
management:
  server:
    port: 27000
logging:
  file:
    name: logs/${spring.application.name}.log
  config: classpath:logback-spring-sleuth.xml

biscuit:
  gateway:
    no-auth-uris:
      - /doc.html
      - /actuator
      - /actuator/health
      - /actuator/info
      - /webjars/**
      - /v3/api-docs/**
      - /*/v3/api-docs
      - /service-b/**
      - /auth/oauth2/token
      - /auth/oauth2/revoke
    disable-csrf: true

# 接口文档
knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式聚合微服务文档，并且是默认`default`分组
    strategy: discover
    discover:
      enabled: true
      # 指定版本号(Swagger2|OpenAPI3)
      version : openapi3
      # 需要排除的微服务(eg:网关服务)
      excluded-services:
        - gateway-service
